<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="crow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L10,7 L0,14" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="white"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#1e293b">Modèle de données — Bibliothèque de quartier</text>

  <!-- AUTEURS -->
  <g>
    <rect x="40" y="80" width="220" height="120" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="40" y="80" width="220" height="34" rx="8" fill="#4f46e5"/>
    <text x="150" y="103" font-size="15" font-weight="bold" fill="white" text-anchor="middle">AUTEURS</text>
    <text x="55" y="136" font-size="13" fill="#1e293b">🔑 id (PK)</text>
    <text x="55" y="158" font-size="13" fill="#1e293b">nom</text>
    <text x="55" y="180" font-size="13" fill="#1e293b">nationalite</text>
  </g>

  <!-- ADHERENTS -->
  <g>
    <rect x="40" y="340" width="220" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="40" y="340" width="220" height="34" rx="8" fill="#059669"/>
    <text x="150" y="363" font-size="15" font-weight="bold" fill="white" text-anchor="middle">ADHERENTS</text>
    <text x="55" y="396" font-size="13" fill="#1e293b">🔑 id (PK)</text>
    <text x="55" y="418" font-size="13" fill="#1e293b">nom</text>
    <text x="55" y="440" font-size="13" fill="#1e293b">contact</text>
  </g>

  <!-- LIVRES -->
  <g>
    <rect x="380" y="80" width="240" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="380" y="80" width="240" height="34" rx="8" fill="#ea580c"/>
    <text x="500" y="103" font-size="15" font-weight="bold" fill="white" text-anchor="middle">LIVRES</text>
    <text x="395" y="136" font-size="13" fill="#1e293b">🔑 id (PK)</text>
    <text x="395" y="158" font-size="13" fill="#1e293b">titre</text>
    <text x="395" y="180" font-size="13" fill="#1e293b">annee_publication</text>
    <text x="395" y="202" font-size="13" fill="#1e293b">🔗 auteur_id (FK)</text>
    <text x="395" y="224" font-size="13" fill="#1e293b">disponible</text>
  </g>

  <!-- EMPRUNTS -->
  <g>
    <rect x="380" y="330" width="260" height="190" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <rect x="380" y="330" width="260" height="34" rx="8" fill="#db2777"/>
    <text x="510" y="353" font-size="15" font-weight="bold" fill="white" text-anchor="middle">EMPRUNTS</text>
    <text x="395" y="386" font-size="13" fill="#1e293b">🔑 id (PK)</text>
    <text x="395" y="408" font-size="13" fill="#1e293b">🔗 livre_id (FK)</text>
    <text x="395" y="430" font-size="13" fill="#1e293b">🔗 adherent_id (FK)</text>
    <text x="395" y="452" font-size="13" fill="#1e293b">date_emprunt</text>
    <text x="395" y="474" font-size="13" fill="#1e293b">date_retour_prevue</text>
    <text x="395" y="496" font-size="13" fill="#1e293b">date_retour_effective</text>
  </g>

  <!-- Relations -->
  <path d="M260,140 C320,140 320,140 380,140" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="300" y="130" font-size="12" fill="#555">1,n</text>
  <text x="280" y="150" font-size="11" fill="#555">écrit</text>

  <path d="M260,400 C320,400 320,410 380,410" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="300" y="390" font-size="12" fill="#555">1,n</text>
  <text x="270" y="418" font-size="11" fill="#555">effectue</text>

  <path d="M500,230 C500,280 500,280 500,330" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="510" y="280" font-size="12" fill="#555">1,n</text>
  <text x="440" y="280" font-size="11" fill="#555">est concerné par</text>

  <text x="20" y="545" font-size="12" fill="#64748b">Légende : 🔑 clé primaire · 🔗 clé étrangère · les flèches en pattes-d'oie (crow's foot) indiquent la cardinalité "plusieurs"</text>
</svg>
